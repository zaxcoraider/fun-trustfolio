[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@openzeppelin/=lib/openzeppelin-contracts/"]

[rpc_endpoints]
og_testnet = "${OG_TESTNET_RPC}"
og_mainnet = "${OG_MAINNET_RPC}"

[etherscan]
og_testnet = { key = "NOKEY", url = "${OG_TESTNET_EXPLORER_API}" }
og_mainnet = { key = "NOKEY", url = "https://chainscan.0g.ai/api", chain = 16661 }
